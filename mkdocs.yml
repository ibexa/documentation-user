INHERIT: plugins.yml

site_name: User Documentation
repo_url: https://github.com/ibexa/documentation-user
site_url: https://doc.ibexa.co/projects/userguide/en/latest/
edit_uri: blob/5.0/docs
hooks:
    - hooks/edit_uri.py  
    - hooks.py
copyright: "Copyright 1999-2026 Ibexa AS and others"
validation:
    omitted_files: warn
    absolute_links: warn
    unrecognized_links: warn
    anchors: warn
not_in_nav: |
    search_results.md
    /snippets/*
nav:
    - Cohesivo User Documentation: index.md
    - Getting started:
        - Get started: getting_started/get_started.md
        - User interface: getting_started/discover_ui.md
        - Dashboard:
            - Dashboard: getting_started/dashboard/dashboard.md
            - Work with dashboard: getting_started/dashboard/work_with_dashboard.md
            - Dashboard block reference: getting_started/dashboard/dashboard_block_reference.md
        - Content tree: getting_started/content_tree/content_tree.md
        - Notifications: getting_started/notifications.md
    - Content model management:
        - Content model: content_management/content_model.md
        - Create and edit content types: content_management/create_edit_content_types.md
        - Configure content type fields: content_management/configure_ct_field_settings.md
    - Content management:
        - Content management: content_management/content_management.md
        - Content items: content_management/content_items.md
        - Create and edit content items: content_management/create_edit_content_items.md
        - Create and edit pages: 
            - Create and edit pages: content_management/create_edit_pages.md
            - Block reference: content_management/block_reference.md
        - Preview content items: content_management/preview_content_items.md
        - Translate content: content_management/translate_content.md
        - Work with forms: content_management/work_with_forms.md
        - Taxonomy management:
            - Taxonomy: content_management/taxonomy/taxonomy.md
            - Work with tags: content_management/taxonomy/work_with_tags.md
        - Content versions:
            - Content versions: content_management/content_versions.md
            - Work with versions: content_management/workflow_management/work_with_versions.md
        - Editorial workflow:
            - Editorial workflow: content_management/workflow_management/editorial_workflow.md
            - View workflow list: content_management/workflow_management/view_workflow_list.md
        - Content organization:
            - Copy, move or hide content: content_management/content_organization/copy_move_hide_content.md
            - Classify content: content_management/content_organization/classify_content.md
            - Manage content locations and URLs: content_management/content_organization/manage_locations_urls.md
        - Collaborative editing: content_management/collaborative_editing.md
    - AI Actions:
        - AI Actions: ai_actions/ai_actions.md
        - Work with AI Actions: ai_actions/work_with_ai_actions.md
    - Product catalog:
        - Product catalog: product_catalog/product_catalog.md
        - Quable integration: product_catalog/quable_integration.md
        - Product catalog settings:
            - Product types: product_catalog/product_types.md
            - Create product types: product_catalog/create_product_types.md
            - Work with product attributes: product_catalog/work_with_product_attributes.md
            - Work with currencies: product_catalog/manage_currencies.md
        - Products:
            - Products: product_catalog/products.md
            - Create and edit products: product_catalog/create_edit_product.md
            - Create virtual products: product_catalog/create_virtual_product.md
            - Work with product assets: product_catalog/work_with_product_assets.md
            - Work with product variants: product_catalog/work_with_product_variants.md
            - Work with product prices: product_catalog/manage_prices.md
            - Work with product availability and stock: product_catalog/manage_availability_and_stock.md
        - Work with catalogs: product_catalog/work_with_catalogs.md
        - Work with product categories: product_catalog/work_with_product_categories.md
        - Work with product page URLs: product_catalog/work_with_product_page_urls.md
    - Content publishing:
        - Publish content: content_management/publish_instantly.md
        - Schedule publication: content_management/schedule_publishing.md
    - Image management:
        - Upload and store images: image_management/upload_images.md
        - Browse images: image_management/browse_images.md
        - Edit images: image_management/edit_images.md     
    - Search: 
        - Search for content: search/search_for_content.md
        - Search Engine Optimization: 
            - SEO: search_engine_optimization/seo.md
            - Work with SEO: search_engine_optimization/work_with_seo.md
    - Commerce:
        - Commerce: commerce/commerce.md
        - Order management: commerce/order_management/order_management.md
        - Work with orders: commerce/order_management/work_with_orders.md
        - Shipping management: commerce/shipping_management/shipping_management.md
        - Work with shipments: commerce/shipping_management/work_with_shipments.md
        - Work with shipping methods: commerce/shipping_management/work_with_shipping_methods.md 
        - Payment management: commerce/payment/payment_management.md
        - Work with payments: commerce/payment/work_with_payments.md
        - Work with payment methods: commerce/payment/work_with_payment_methods.md
        - Discounts:
            - Discounts: commerce/discounts/discounts.md
            - Work with Discounts: commerce/discounts/work_with_discounts.md
    - Recommendations:
        - Raptor integration:
            - Recommendation blocks: recommendations/raptor_integration/raptor_recommendation_blocks.md
    - Data collection:
        - Qualifio integration: qualifio/qualifio.md
    - Customer management:
        - Customer management: customer_management/customer_management.md
        - Customer Portal: customer_management/customer_portal.md
        - Create and edit Customer Portal: customer_management/build_customer_portal.md
        - Manage customers: customer_management/manage_customers.md
        - Company self-registration: customer_management/company_self_registration.md
    - Website organization:
        - Multisite: website_organization/multisite.md
        - Work with sites: website_organization/work_with_sites.md
    - Permissions and users: 
        - Permission system: permission_management/permission_system.md
        - Work with permissions: permission_management/work_with_permissions.md
        - Manage users: user_management/manage_users.md
        - Recent activity: recent_activity/recent_activity.md
    - User paths:
        - Explorer: persona_paths/explorer.md
        - Administrator: 
            - Application administrator: persona_paths/administrator.md
            - Manage permissions and users: permission_management/permissions_and_users.md
            - Manage content model: persona_paths/manage_content_model.md
        - Content editor: 
            - Content editor: persona_paths/editor.md
            - Author content: persona_paths/author_content.md
            - Publish content: persona_paths/publish_content.md
            - Organize content: persona_paths/organize_content.md
        - Store manager: 
            - Store manager: persona_paths/shop_manager.md
            - Manage products: persona_paths/manage_products.md

              
theme:
    name: material
    features:
        - content.code.annotate 
        - content.code.copy
        - navigation.tracking
        - navigation.top
    custom_dir: 'theme'
    favicon: 'images/favicon.png'
    language: 'en'
    palette:
        primary: 'blue grey'
        accent: 'deep orange'
    logo: 'images/cohesivo-logo.svg'

extra:
  append_bootstrap:
    - '/index.md'

  related_docs:
    - title: 'User Documentation'
      url: '/projects/userguide'
    - title: 'Developer Documentation'
      url: '/'
    - title: 'Connect Documentation'
      url: '/projects/connect'
  # Global variables
  site_display_name: 'Ibexa Documentation'
  product_name_base: 'Ibexa'
  product_name: 'Cohesivo'
  product_name_content: 'Cohesivo Content'
  product_name_headless: 'Cohesivo Headless'
  product_name_exp: 'Cohesivo Experience'
  product_name_com: 'Cohesivo Commerce'
  product_name_cdp: 'Raptor CDP'
  product_name_cdp_base: 'Raptor'
  product_name_connect: 'Ibexa Connect'
  product_name_cloud: 'Ibexa Cloud'
  product_name_oss: 'Cohesivo OSS'
  product_name_dam: 'Ibexa DAM'
  product_name_engage: 'Qualifio'
  pim_product_name: 'Quable'

  developer_doc: 'https://doc.ibexa.co/en/6.0'

  latest_tag_4_6: '4.6.32'
  latest_tag_5_0: '5.0.10'
  latest_tag_6_0: '6.0.0'

extra_css:
  - fonts/MavenPro.css
  - css/tokens.css
  - css/codehilite.css
  - css/switcher.css
  - css/custom.css
  - css/page-not-found.css
  - css/navigation.css
  - css/pills.css
  - css/search.css
  - css/docs.switcher.css
  - css/jquery-ui.min.css
  - '//cdn.jsdelivr.net/npm/docsearch.js@2/dist/cdn/docsearch.min.css'

extra_javascript:
  - js/jquery.min.js
  - js/jquery-ui.min.js
  - js/custom.js
  - js/error-page.js
  - js/docs.switcher.js
  - '//cdn.jsdelivr.net/npm/docsearch.js@2/dist/cdn/docsearch.min.js'

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - meta
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      guess_lang: false
      linenums: true
      # Emit language-* classes so the Markdown conversion (llmstxt) can
      # restore the language on fenced code blocks.
      pygments_lang_class: true
      extend_pygments_lang:
        - name: php
          lang: php
          options:
            startinline: true
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.details
